[package]
authors = ["WillBooster Inc."]
autoexamples = false
categories = ["parser-implementations", "parsing", "text-editors"]
description = "C++ grammar for tree-sitter"
edition = "2024"
keywords = ["incremental", "parsing", "tree-sitter", "cpp"]
license = "MIT"
name = "willbooster-tree-sitter-cpp"
readme = "README.md"
repository = "https://github.com/WillBooster/tree-sitter-cpp"
version = "0.0.0"

build = "bindings/rust/build.rs"
include = ["/bindings/rust/*", "/c/queries/*", "/queries/*", "/src/*", "/tree-sitter.json", "/LICENSE"]

[lib]
name = "tree_sitter_cpp"
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = { package = "willbooster-tree-sitter", version = "1" }
